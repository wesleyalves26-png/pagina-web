<!-- Post principal em formato de card -->
<article id="card-post" class="card-post">
  <img src="sua-imagem.jpg" alt="Descrição da imagem do post" class="card-imagem">

  <div class="card-conteudo">
    <small class="card-data">Publicado em 28 de Outubro</small>
    <h2>Título do Novo Post</h2>
    <p>Este post agora reage às interações trocando a cor de fundo dinamicamente!</p>

    <!-- Botões de Reação -->
    <div class="card-reações">
      <button class="btn-reacao">❤️ <span class="contador">0</span></button>
      <button class="btn-reacao">🔥 <span class="contador">0</span></button>
      <button class="btn-reacao">👏 <span class="contador">0</span></button>
    </div>

    <!-- Botão para Mudar o Fundo -->
    <button id="btn-fundo" class="btn-fundo">🎨 Alternar Fundo do Card</button>
  </div>
</article>
